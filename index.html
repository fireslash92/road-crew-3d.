<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>محاكي التحكم بالمعدات التعليمي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&family=IBM+Plex+Mono:wght@500&family=Tajawal:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D jobsite; operator HUD across the top, joystick + machine levers docked at the bottom.
   Single deliberate look: daylight site with dark cab-console panels, so colors are fixed rather than themed. */
:root{
  --console:rgba(22,24,27,.84); --console-solid:#16181B; --edge:rgba(255,255,255,.14);
  --ink:#ECEDEA; --muted:#A3A8AD; --amber:#F2A900; --amber-ink:#16181B; --live:#57C78B;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#C9B48F;color:var(--ink);font-family:var(--f-body);overflow:hidden;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top,.bar,.dock{pointer-events:none}
.mbtn,.tools,.hud,#hint,.panel,.org{pointer-events:auto}
.org{align-self:center;max-width:100%;text-align:center;display:flex;flex-direction:column;line-height:1.4;padding:5px 18px 6px;
  background:var(--console);border:1px solid var(--edge);border-bottom:2px solid var(--amber);border-radius:8px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:"Tajawal","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif}
.org span{font-size:13px;font-weight:500;color:var(--muted)}
.org b{font-size:18px;font-weight:700;color:var(--ink)}
.top{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mbtn{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;
  background:var(--amber);color:var(--amber-ink);border:0;padding:3px 10px;border-radius:5px;line-height:1.2;display:flex;align-items:center;gap:8px}
.mbtn small{font:600 11px var(--f-body);letter-spacing:.06em;opacity:.75}
.tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tbtn{font:600 13px var(--f-body);color:var(--ink);background:var(--console);border:1px solid var(--edge);border-radius:6px;
  padding:7px 10px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tbtn[aria-pressed=true]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hud{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.hud::-webkit-scrollbar{display:none}
.chip{background:var(--console);border:1px solid var(--edge);border-radius:6px;padding:4px 9px;white-space:nowrap;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;line-height:1.15}
.chip span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.chip.gear b{color:var(--amber)}
#hint{align-self:flex-start;max-width:min(440px,100%);background:var(--console);border:1px solid var(--edge);border-left:3px solid var(--amber);
  border-radius:6px;padding:8px 11px;font-size:13.5px;line-height:1.4}
#hint button{all:unset;cursor:pointer;color:var(--amber);font-weight:600;margin-left:6px}
.dock{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.panel{background:var(--console);border:1px solid var(--edge);border-radius:10px;padding:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.drive{display:flex;flex-direction:column;align-items:center;gap:8px}
.ptitle{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-self:stretch}
#joy{width:128px;height:128px;border-radius:50%;position:relative;touch-action:none;cursor:grab;
  background:radial-gradient(circle,rgba(255,255,255,.06) 0 30%,rgba(255,255,255,.02) 31% 100%);border:1px solid var(--edge)}
#joy::before,#joy::after{content:"";position:absolute;background:var(--edge)}
#joy::before{left:50%;top:10px;bottom:10px;width:1px}
#joy::after{top:50%;left:10px;right:10px;height:1px}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--amber);box-shadow:0 3px 10px rgba(0,0,0,.4);z-index:1}
.jlab{position:absolute;font:500 10px var(--f-mono);color:var(--muted)}
.levers{display:grid;grid-template-columns:auto 52px 52px;gap:6px;align-items:center;max-width:100%}
.levers .ptitle{grid-column:1/-1}
.ll{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-right:4px;line-height:1.1}
.ll small{display:block;font:500 11px var(--f-mono);color:var(--ink);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.lv{height:44px;border-radius:7px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--ink);font:600 17px var(--f-body);
  cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.lv.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.tog{grid-column:1/-1;font:600 13px var(--f-body);color:var(--ink);background:transparent;border:1px solid var(--edge);border-radius:6px;padding:8px 10px;cursor:pointer}
.tog[aria-pressed=true]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.tog.act{border-style:dashed}
.keys{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:none}
@media (min-width:900px){
  .dock{justify-content:flex-start}
  .keys{display:block;pointer-events:auto;font:500 11.5px var(--f-mono);color:var(--muted);line-height:1.6;text-align:right}
  .keys b{color:var(--ink);font-weight:500}
}
@media (max-width:420px){#joy{width:112px;height:112px}.levers{grid-template-columns:auto 46px 46px}.lv{height:42px}.panel{padding:8px}.mbtn{font-size:18px}}
/* selection sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,11,12,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 40px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sheet{align-items:center}}
.card{background:var(--console-solid);border:1px solid var(--edge);border-radius:12px;width:min(760px,100%);max-height:100%;overflow:auto;padding:14px 14px 16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.card-h h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.stage-h{font:600 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:14px 0 6px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.items{grid-template-columns:minmax(0,1fr)}}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:10px 12px;border:1px solid var(--edge);border-radius:8px;background:rgba(255,255,255,.03);min-width:0}
.item:hover{background:rgba(255,255,255,.07)}
.item[aria-current=true]{border-color:var(--amber);background:rgba(242,169,0,.12)}
.item b{display:block;font-size:15px;font-weight:600}
.item span{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.item i{display:block;font:500 11px var(--f-mono);font-style:normal;color:var(--ink);opacity:.7;margin-top:5px}
.item:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#16181B;color:#ECEDEA;font-size:15px}
</style>
</head>
<body>
<div id="stage" aria-label="3D view of a road construction site. Drag to orbit the camera."></div>

<div class="ui">
  <div class="top">
    <div class="org" dir="rtl" lang="ar"><span>دائرة الطرق بمحافظة البريمي</span><b>محاكي التحكم بالمعدات التعليمي</b></div>
    <div class="bar">
      <button class="mbtn" id="bMach" type="button" aria-haspopup="dialog"><span id="mName">Motor Grader</span><small>Change ▾</small></button>
      <div class="tools">
        <button class="tbtn" id="bCam" type="button">Camera: Orbit</button>
        <button class="tbtn" id="bAuto" type="button" aria-pressed="false">Autopilot</button>
        <button class="tbtn" id="bSite" type="button" aria-haspopup="dialog">Site</button>
        <button class="tbtn" id="bSnd" type="button" aria-pressed="false">Sound</button>
        <button class="tbtn" id="bDock" type="button" aria-pressed="true">Controls</button>
      </div>
    </div>
    <div class="hud" id="hud"></div>
    <div id="hint"><span id="hintT"></span> <button id="hintX" type="button">Got it</button></div>
  </div>
  <div class="dock" id="dock">
    <div class="panel drive">
      <div class="ptitle"><span>Drive</span><span id="dSteer">0°</span></div>
      <div id="joy" role="slider" aria-label="Drive joystick" aria-valuetext="stopped">
        <span class="jlab" style="top:4px;left:50%;transform:translateX(-50%)">FWD</span>
        <span class="jlab" style="bottom:4px;left:50%;transform:translateX(-50%)">REV</span>
        <div id="knob"></div>
      </div>
    </div>
    <div class="panel levers" id="levers"></div>
  </div>
  <div class="keys" id="keys"></div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <div class="card">
    <div class="card-h"><h2 id="sheetT">Choose a machine</h2><button class="tbtn" id="sheetX" type="button">Close</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
<script>
(function(){
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div id="err">The 3D engine could not load. Check your connection and reopen the page.</div>');return;}
const T=THREE, $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), DEG=Math.PI/180;
const approach=(c,t,r,dt)=>c<t?Math.min(t,c+r*dt):Math.max(t,c-r*dt);
const normAng=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};

/* ================= Renderer & scene ================= */
const stage=$('stage');
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.6;
stage.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#BFD3E2');scene.fog=new T.Fog('#D6D1C4',90,460);
const camera=new T.PerspectiveCamera(50,1,0.2,3000);
const hemi=new T.HemisphereLight('#DDE8F2','#8A6E4C',1.0);scene.add(hemi);
const SUN=new T.Vector3(22,19,12).normalize();
const sun=new T.DirectionalLight('#FFF1DA',2.4);sun.castShadow=true;
/* physical sky + image-based lighting taken from it */
try{if(T.Sky){const sky=new T.Sky();sky.scale.setScalar(1000);const u=sky.material.uniforms;
  u.turbidity.value=7;u.rayleigh.value=1.4;u.mieCoefficient.value=.006;u.mieDirectionalG.value=.82;u.sunPosition.value.copy(SUN);
  scene.add(sky);sky.updateMatrixWorld();const pmg=new T.PMREMGenerator(renderer);scene.environment=pmg.fromScene(sky).texture;pmg.dispose();hemi.intensity=.5;}}catch(e){}
/* soft particles: dust, exhaust, steam */
const PN=320,qP=new Float32Array(PN*3),qA=new Float32Array(PN),qS=new Float32Array(PN),qC=new Float32Array(PN*3),qV=new Float32Array(PN*3),
  qL=new Float32Array(PN),qM=new Float32Array(PN),qA0=new Float32Array(PN),qS0=new Float32Array(PN);let qI=0;
const pgeo=new T.BufferGeometry();pgeo.setAttribute('position',new T.BufferAttribute(qP,3));pgeo.setAttribute('aA',new T.BufferAttribute(qA,1));
pgeo.setAttribute('aS',new T.BufferAttribute(qS,1));pgeo.setAttribute('aC',new T.BufferAttribute(qC,3));
const pmat=new T.ShaderMaterial({uniforms:{uK:{value:600}},transparent:true,depthWrite:false,
  vertexShader:'attribute float aA;attribute float aS;attribute vec3 aC;varying float vA;varying vec3 vC;uniform float uK;void main(){vA=aA;vC=aC;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aS*uK/max(0.1,-mv.z);gl_Position=projectionMatrix*mv;}',
  fragmentShader:'varying float vA;varying vec3 vC;void main(){float d=length(gl_PointCoord-0.5);float a=smoothstep(0.5,0.05,d)*vA;if(a<0.004)discard;gl_FragColor=vec4(vC,a);}'});
const puffs=new T.Points(pgeo,pmat);puffs.frustumCulled=false;scene.add(puffs);
const DUST=[.80,.70,.55],SMOKE=[.17,.17,.18],STEAM=[.93,.94,.95],GREY=[.56,.55,.53];
function puff(x,y,z,vx,vy,vz,size,life,colr,alpha){const i=qI;qI=(qI+1)%PN;qP[i*3]=x;qP[i*3+1]=y;qP[i*3+2]=z;qV[i*3]=vx;qV[i*3+1]=vy;qV[i*3+2]=vz;
  qS0[i]=size;qL[i]=qM[i]=life;qA0[i]=alpha;qC[i*3]=colr[0];qC[i*3+1]=colr[1];qC[i*3+2]=colr[2];}
function puffStep(dt){for(let i=0;i<PN;i++){if(qL[i]<=0){qA[i]=0;continue;}qL[i]-=dt;const t=1-Math.max(0,qL[i])/qM[i];
  qP[i*3]+=qV[i*3]*dt;qP[i*3+1]+=qV[i*3+1]*dt;qP[i*3+2]+=qV[i*3+2]*dt;qV[i*3]*=1-dt*.8;qV[i*3+2]*=1-dt*.8;
  qA[i]=qA0[i]*(1-t)*Math.min(1,t*8);qS[i]=qS0[i]*(1+2.2*t);}
  pgeo.attributes.position.needsUpdate=true;pgeo.attributes.aA.needsUpdate=true;pgeo.attributes.aS.needsUpdate=true;pgeo.attributes.aC.needsUpdate=true;}
const smap=innerWidth<700?1024:2048;sun.shadow.mapSize.set(smap,smap);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:90});
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;scene.add(sun);scene.add(sun.target);

/* ================= Terrain: deformable heightfield with material layers ================= */
const SIZE=80,N=160,CELL=SIZE/N,V=N+1,HALF=SIZE/2,AREA=CELL*CELL;
const H=new Float32Array(V*V), D=new Uint8Array(V*V), Cp=new Float32Array(V*V), W=new Float32Array(V*V),
      B=new Float32Array(V*V), A=new Float32Array(V*V), STAMP=new Int32Array(V*V), base=new Float32Array(V*V*3);
// D codes: 0 native, 1 cut soil, 2 loose soil, 3 ripped, 6 tack coat, 7 asphalt mat, 9 milled, 10 aggregate base, 11 old asphalt
const SOIL=new Set([0,1,2,3,10]);
const geo=new T.PlaneGeometry(SIZE,SIZE,N,N);geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position, col=new T.BufferAttribute(new Float32Array(V*V*3),3);geo.setAttribute('color',col);
/* procedural, tileable ground textures: grain + pebbles as albedo, normal and roughness maps */
function groundTex(){const n=256,r=rnd(9173),h=new Float32Array(n*n);
  for(let o=0,amp=1,f=4;o<5;o++,amp*=.55,f*=2){const g=new Float32Array(f*f);for(let i=0;i<f*f;i++)g[i]=r();
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const u=x/n*f,v=y/n*f,x0=Math.floor(u),y0=Math.floor(v),fx=u-x0,fy=v-y0,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy),x1=(x0+1)%f,y1=(y0+1)%f;
      h[y*n+x]+=amp*((g[y0*f+x0]*(1-sx)+g[y0*f+x1]*sx)*(1-sy)+(g[y1*f+x0]*(1-sx)+g[y1*f+x1]*sx)*sy);}}
  for(let i=0;i<n*n;i++)h[i]/=2.07;
  for(let p=0;p<240;p++){const cx=r()*n,cy=r()*n,rad=1.5+r()*r()*7,hg=.3+r()*.5,Rr=Math.ceil(rad);
    for(let dy=-Rr;dy<=Rr;dy++)for(let dx=-Rr;dx<=Rr;dx++){const d2=(dx*dx+dy*dy)/(rad*rad);if(d2>=1)continue;
      const x=((Math.floor(cx+dx))%n+n)%n,y=((Math.floor(cy+dy))%n+n)%n,q=y*n+x;h[q]=Math.max(h[q],h[q]*.5+hg*Math.sqrt(1-d2));}}
  const H2=(x,y)=>h[((y+n)%n)*n+((x+n)%n)];
  const mk=fn=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),im=x.createImageData(n,n);
    for(let i=0;i<n*n;i++){const v=fn(i%n,Math.floor(i/n),h[i]);im.data[i*4]=v[0];im.data[i*4+1]=v[1];im.data[i*4+2]=v[2];im.data[i*4+3]=255;}
    x.putImageData(im,0,0);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;};
  const alb=mk((x,y,v)=>{const g=Math.round(255*clamp(.72+.3*v+(r()-.5)*.06,0,1));return [g,g,g];});alb.encoding=T.sRGBEncoding;
  const nrm=mk((x,y)=>{const dx=(H2(x+1,y)-H2(x-1,y))*3.2,dy=(H2(x,y+1)-H2(x,y-1))*3.2,l=Math.hypot(dx,dy,1);return [Math.round((-dx/l*.5+.5)*255),Math.round((-dy/l*.5+.5)*255),Math.round((1/l*.5+.5)*255)];});
  const rgh=mk((x,y,v)=>{const g=Math.round(255*clamp(.6+.45*v,0,1));return [g,g,g];});
  return {alb,nrm,rgh};}
const GT=groundTex();
function texRep(t,rp){const c=t.clone();c.repeat.set(rp,rp);c.needsUpdate=true;return c;}
const terrMat=new T.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0,map:texRep(GT.alb,32),normalMap:texRep(GT.nrm,32),normalScale:new T.Vector2(.9,.9),envMapIntensity:.35});
// darker surfaces (wet soil, tack coat, asphalt) get a smoother, slightly glossy finish
terrMat.onBeforeCompile=sh=>{sh.fragmentShader=sh.fragmentShader.replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n roughnessFactor*=mix(0.5,1.0,smoothstep(0.015,0.2,dot(vColor.rgb,vec3(0.333))));');};
const terrain=new T.Mesh(geo,terrMat);terrain.receiveShadow=true;scene.add(terrain);
const outer=new T.Mesh(new T.PlaneGeometry(1800,1800),new T.MeshStandardMaterial({color:new T.Color('#B99C70').convertSRGBToLinear(),roughness:1,map:texRep(GT.alb,720),normalMap:texRep(GT.nrm,720),envMapIntensity:.35}));
outer.rotation.x=-Math.PI/2;outer.position.y=-0.04;outer.receiveShadow=true;scene.add(outer);
const CC={cut:new T.Color('#7E6044'),loose:new T.Color('#C7A574'),rip:new T.Color('#6B5039'),agg:new T.Color('#918C84'),
  tack:new T.Color('#2C2119'),hot:new T.Color('#4A4540'),rolled:new T.Color('#232324'),milled:new T.Color('#6E6D69'),old:new T.Color('#5E5D59')};
for(const k in CC)CC[k].convertSRGBToLinear();
let dirty=null,FRAME=0;
function mark(i,j){if(!dirty)dirty={i0:i,i1:i,j0:j,j1:j};else{if(i<dirty.i0)dirty.i0=i;if(i>dirty.i1)dirty.i1=i;if(j<dirty.j0)dirty.j0=j;if(j>dirty.j1)dirty.j1=j;}}
const tc=new T.Color();
function flushTerrain(){
  if(!dirty)return;const {i0,i1,j0,j1}=dirty;

    if(H[id]>vP.y){const dh=Math.min(H[id]-vP.y,.06);H[id]-=dh;
      for(const sg of [-1,1]){const nb=idxOf(vP.x+right.x*CELL*sg,vP.z+right.z*CELL*sg);if(nb>=0){H[nb]+=dh*.55;if(D[nb]!==3)D[nb]=2;Cp[nb]=0;mark(nb%V,(nb/V)|0);}}
      D[id]=3;Cp[id]=0;mark(id%V,(id/V)|0);}}}
// one roller/drum pass over a strip; returns average compaction under it
function compactBand(lx0,lx1,lz0,lz1,soilInc,asphInc,smooth){
  let sum=0,n=0;
  forRect(lx0,lx1,lz0,lz1,(k,i,j)=>{
    const fresh=FRAME-STAMP[k]>5;STAMP[k]=FRAME;const d=D[k];
    if(d===7){if(fresh&&asphInc>0){Cp[k]=Math.min(1,Cp[k]+asphInc);H[k]=B[k]+A[k]*(1-.2*Cp[k]);mark(i,j);}sum+=Cp[k];n++;}
    else if(SOIL.has(d)){if(fresh&&soilInc>0){const eff=soilInc*(.55+.65*W[k]);const before=Cp[k];Cp[k]=Math.min(1,Cp[k]+eff);
        const loose=(d===2||d===3)?1:.35;H[k]-=.03*loose*(Cp[k]-before);
        if(smooth){const avg=(H[k+1]+H[k-1]+H[k+V]+H[k-V])/4;H[k]+= (avg-H[k])*.35;}
        W[k]*=.85;mark(i,j);}
      sum+=Cp[k];n++;}
  });
  return n?sum/n:null;
}

  {const ex=rod(.05,M.dark,G);ex.position.set(-.75,2.65,.5);ex.scale.y=.7;}

/* ================= Switching & UI ================= */
const held=new Set(),keys=new Set();let joy={x:0,y:0,active:false},auto={on:false,pass:0,phase:'fwd'};
const LKEYS=[['r','f'],['x','z'],['v','c'],['n','b']], TKEYS=['t','g'], AKEYS=['u'];
function switchMachine(id,keepPos=true){
  stopAuto();held.clear();
  if(G)scene.remove(G);
  cur=MACHINES.find(m=>m.id===id);G=new T.Group();G.rotation.order='YZX';P={};R={c:{},t:{},s:{}};
  cur.levers.forEach(l=>R.c[l.id]=l.init);(cur.toggles||[]).forEach(t=>R.t[t.id]=false);
  cur.build(G,P);G.traverse(o=>{if(o.isMesh)o.castShadow=true;});scene.add(G);
  st.v=0;st.steer=0;if(!keepPos){st.x=-20;st.z=cur.lanes[0];st.th=0;}
  $('mName').textContent=cur.name;
  buildLevers();buildHud();$('hintT').textContent=cur.tip;$('hint').hidden=false;
  $('keys').innerHTML='<b>W/S</b> throttle · <b>A/D</b> steer<br>'+cur.levers.map((l,i)=>`<b>${LKEYS[i][1].toUpperCase()}/${LKEYS[i][0].toUpperCase()}</b> ${l.label.toLowerCase()}`).join(' · ')+
    ((cur.toggles||[]).length?'<br>'+cur.toggles.map((t,i)=>`<b>${TKEYS[i].toUpperCase()}</b> ${t.on.toLowerCase()}`).join(' · '):'')+
    ((cur.actions||[]).length?' · <b>U</b> '+cur.actions[0].label.toLowerCase():'')+'<br>drag to orbit';
  step(0);
}
function buildLevers(){
  const el=$('levers');let h=`<div class="ptitle"><span>${cur.levers.length?'Levers':'Controls'}</span><span>${cur.levers.length?'hold':''}</span></div>`;
  cur.levers.forEach((l,i)=>{h+=`<div class="ll">${l.label}<small id="lv${i}"></small></div><button class="lv" type="button" data-l="${i}" data-d="-1" aria-label="${l.label} down">${l.sym[0]}</button><button class="lv" type="button" data-l="${i}" data-d="1" aria-label="${l.label} up">${l.sym[1]}</button>`;});
  (cur.toggles||[]).forEach((t,i)=>{h+=`<button class="tog" type="button" data-t="${i}" aria-pressed="false">${t.off}</button>`;});
  (cur.actions||[]).forEach((a,i)=>{h+=`<button class="tog act" type="button" data-a="${i}">${a.label}</button>`;});
  el.innerHTML=h;
  el.querySelectorAll('.lv').forEach(b=>{const act='L'+b.dataset.l+(b.dataset.d==='1'?'+':'-');
    const on=e=>{e.preventDefault();stopAuto();held.add(act);b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
    const off=()=>{held.delete(act);b.classList.remove('on');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault());});
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{stopAuto();toggle(+b.dataset.t);});
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{cur.actions[+b.dataset.a].fn();});
}
function toggle(i){const t=cur.toggles[i];R.t[t.id]=!R.t[t.id];syncToggles();}
function syncToggles(){document.querySelectorAll('#levers [data-t]').forEach(b=>{const t=cur.toggles[+b.dataset.t];b.setAttribute('aria-pressed',String(!!R.t[t.id]));b.textContent=R.t[t.id]?t.on:t.off;});}
let hudEls=[];
function buildHud(){const list=[['Gear','N'],['Speed','0']].concat(cur.hud());
  $('hud').innerHTML=list.map((x,i)=>`<div class="chip${i===0?' gear':''}"><span>${x[0]}</span><b></b></div>`).join('');hudEls=[...$('hud').querySelectorAll('b')];}
function hud(){
  const list=[['Gear',st.v>.05?'F':st.v<-.05?'R':'N'],['Speed',(Math.abs(st.v)*3.6).toFixed(1)+' km/h']].concat(cur.hud());
  list.forEach((x,i)=>{if(hudEls[i]&&hudEls[i].textContent!==x[1])hudEls[i].textContent=x[1];});
  cur.levers.forEach((l,i)=>{const e=$('lv'+i);if(e)e.textContent=l.fmt(R.c[l.id]);});
  $('dSteer').textContent=Math.round(-st.steer/DEG)+'°';syncToggles();
  $('joy').setAttribute('aria-valuetext',st.v>.05?'forward':st.v<-.05?'reverse':'stopped');
}
/* sheet */
const STAGES=['Earthworks','Subgrade & base','Paving','Asphalt compaction'];
const SITES=[{id:'raw',name:'Raw ground',role:'Uneven native soil with humps and dips. Start here with the dozer and grader.',spec:'Earthworks'},
  {id:'base',name:'Graded base',role:'A 10 m crowned gravel base course, graded and ready for tack coat, paving and rolling.',spec:'Paving'},
  {id:'old',name:'Worn asphalt road',role:'An old 9 m asphalt road with ruts and potholes, ready for milling and resurfacing.',spec:'Milling & overlay'}];
let siteId='raw';
function openSheet(kind){
  const body=$('sheetBody');let h='';
  if(kind==='mach'){$('sheetT').textContent='Choose a machine';
    STAGES.forEach((s,si)=>{h+=`<div class="stage-h">${si+1} · ${s}</div><div class="items">`;
      MACHINES.filter(m=>m.stage===s).forEach(m=>{h+=`<button class="item" type="button" data-m="${m.id}" aria-current="${m.id===cur.id}"><b>${m.name}</b><span>${m.role}</span><i>${m.spec}</i></button>`;});h+='</div>';});
  } else {$('sheetT').textContent='Reset the job site';h='<div class="items" style="margin-top:8px">';
    SITES.forEach(s=>{h+=`<button class="item" type="button" data-s="${s.id}" aria-current="${s.id===siteId}"><b>${s.name}</b><span>${s.role}</span><i>Best for: ${s.spec}</i></button>`;});h+='</div>';}
  body.innerHTML=h;$('sheet').hidden=false;
  body.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{switchMachine(b.dataset.m,true);closeSheet();});
  body.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{resetSite(b.dataset.s);closeSheet();});
  const first=body.querySelector('[aria-current=true]')||body.querySelector('button');first&&first.focus();
}
function closeSheet(){$('sheet').hidden=true;}
$('bMach').onclick=()=>openSheet('mach');$('bSite').onclick=()=>openSheet('site');$('sheetX').onclick=closeSheet;
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet();});
function resetSite(id){stopAuto();siteId=id;genSite(id);flushTerrain();placeStakes();Object.assign(st,{x:-20,z:cur.lanes[0],th:0,v:0,steer:0});
  R.s={};cur.levers.forEach(l=>R.c[l.id]=l.init);(cur.toggles||[]).forEach(t=>R.t[t.id]=false);step(0);placeOrbitCam();}

/* input */
const joyEl=$('joy'),knob=$('knob');
function joyMove(e){const r=joyEl.getBoundingClientRect(),Rr=r.width/2-14;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d>Rr){dx*=Rr/d;dy*=Rr/d;}joy.x=dx/Rr;joy.y=dy/Rr;knob.style.transform=`translate(${dx}px,${dy}px)`;}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();stopAuto();joy.active=true;try{joyEl.setPointerCapture(e.pointerId);}catch(_){}joyMove(e);});
joyEl.addEventListener('pointermove',e=>{if(joy.active)joyMove(e);});
const joyEnd=()=>{joy.active=false;joy.x=0;joy.y=0;knob.style.transform='';};
joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{if(!$('sheet').hidden){if(e.key==='Escape')closeSheet();return;}
  const k=e.key.toLowerCase();if(e.target.closest&&e.target.closest('button')&&(k===' '||k==='enter'))return;
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys.add(k);stopAuto();e.preventDefault();}
  LKEYS.forEach((p,i)=>{if(i<cur.levers.length){if(k===p[0]){held.add('L'+i+'+');stopAuto();}if(k===p[1]){held.add('L'+i+'-');stopAuto();}}});
  const ti=TKEYS.indexOf(k);if(ti>=0&&!e.repeat&&cur.toggles&&cur.toggles[ti]){stopAuto();toggle(ti);}
  if(k==='u'&&!e.repeat&&cur.actions&&cur.actions[0])cur.actions[0].fn();});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys.delete(k);LKEYS.forEach((p,i)=>{if(k===p[0])held.delete('L'+i+'+');if(k===p[1])held.delete('L'+i+'-');});});
addEventListener('blur',()=>{keys.clear();held.clear();joyEnd();});
$('hintX').onclick=()=>{$('hint').hidden=true;};
$('bDock').onclick=()=>{const d=$('dock');d.hidden=!d.hidden;$('bDock').setAttribute('aria-pressed',String(!d.hidden));};
const CAMS=['Orbit','Chase','Cab'];let camMode=0;
$('bCam').onclick=()=>{camMode=(camMode+1)%3;$('bCam').textContent='Camera: '+CAMS[camMode];controls.enabled=camMode===0;if(camMode===0)placeOrbitCam();};
$('bAuto').onclick=()=>{if(auto.on)stopAuto();else{auto={on:true,pass:0,phase:st.x>0?'rev':'fwd'};$('bAuto').setAttribute('aria-pressed','true');}};
function stopAuto(){if(!auto.on)return;auto.on=false;$('bAuto').setAttribute('aria-pressed','false');}

/* camera */
const controls=new T.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=4;controls.maxDistance=70;controls.enablePan=false;
const lastTarget=new T.Vector3();
function placeOrbitCam(){const c=new T.Vector3(st.x,hAt(st.x,st.z)+1.5,st.z);controls.target.copy(c);lastTarget.copy(c);camera.position.set(st.x-9,c.y+7,st.z+12);controls.update();}
const camPos=new T.Vector3(),look=new T.Vector3();
function updateCamera(dt){const gy=G.position.y;
  if(camMode===0){const t=new T.Vector3(st.x,gy+1.5,st.z);const d=t.clone().sub(lastTarget);camera.position.add(d);controls.target.add(d);lastTarget.copy(t);controls.update();}
  else{const c=cur.cam,wp=G.localToWorld(t2.set(...(camMode===1?c.chase:c.cab)).clone());
    if(camMode===1)camPos.lerp(wp,1-Math.pow(.02,dt));else camPos.copy(wp);camera.position.copy(camPos);
    camera.lookAt(look.copy(G.localToWorld(t2.set(...(camMode===1?c.look:c.cabLook)).clone())));}
  sun.position.set(st.x+2+SUN.x*38,gy+SUN.y*38,st.z+SUN.z*38);sun.target.position.set(st.x+2,gy,st.z);}

/* ================= Effects: wheel tracks, dust, exhaust, sound ================= */
const EXH={dozer:[2.2,3.2,.4],grader:[-1.6,3.3,.55],tack:[3.5,3.55,.8],padfoot:[-.75,3.05,.5],smooth:[-.75,3.05,.5],planer:[3.9,3.4,.8]};
function tracks(){const k=cur.contact,c=Math.cos(st.th),s=Math.sin(st.th),offs=cur.track?[-.2,.2]:[0];
  for(const lx of [k.r,k.f])for(const sd of [-1,1])for(const o of offs){const lz=sd*(k.half+o),id=idxOf(st.x+lx*c+lz*s,st.z-lx*s+lz*c);
    if(id>=0&&SOIL.has(D[id])&&Cp[id]<.45){Cp[id]=Math.min(.45,Cp[id]+.12);H[id]-=.004;mark(id%V,Math.floor(id/V));}}}
function effects(dt){const sp=Math.abs(st.v),e=EXH[cur.id];
  if(e&&Math.random()<dt*(5+10*sp/cur.vmax)){t2.set(e[0],e[1],e[2]);G.localToWorld(t2);puff(t2.x,t2.y,t2.z,(Math.random()-.5)*.3,.9+Math.random()*.5,(Math.random()-.5)*.3,.35,1.6,SMOKE,.26);}
  if(sp>.4){const k=cur.contact;for(const lz of [-k.half,k.half]){if(Math.random()<dt*sp*5){t2.set(k.r,.1,lz);G.localToWorld(t2);const id=idxOf(t2.x,t2.z);
    if(id>=0&&SOIL.has(D[id])&&W[id]<.5)puff(t2.x,t2.y+.1,t2.z,-Math.cos(st.th)*st.v*.25,.35+Math.random()*.3,Math.sin(st.th)*st.v*.25,.7,1.8,DUST,.2);}}}
  puffStep(dt);}
let AC=null,snd=null,sndOn=false;
$('bSnd').onclick=()=>{try{
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const o1=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain(),bo=AC.createOscillator(),bg=AC.createGain();
    o1.type='sawtooth';o2.type='square';o1.frequency.value=44;o2.frequency.value=29;lp.type='lowpass';lp.frequency.value=260;g.gain.value=0;o1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(AC.destination);
    bo.type='square';bo.frequency.value=1150;bg.gain.value=0;bo.connect(bg);bg.connect(AC.destination);o1.start();o2.start();bo.start();snd={o1,o2,lp,g,bg};}
  sndOn=!sndOn;if(sndOn)AC.resume();else{snd.g.gain.setTargetAtTime(0,AC.currentTime,.05);snd.bg.gain.setTargetAtTime(0,AC.currentTime,.02);}
  $('bSnd').setAttribute('aria-pressed',String(sndOn));}catch(e){}};
function sound(now){if(!sndOn||!snd)return;const th=Math.abs(st.v)/cur.vmax,t=AC.currentTime,load=held.size?1:0;
  snd.o1.frequency.setTargetAtTime(40+34*th+3*load,t,.12);snd.o2.frequency.setTargetAtTime(27+22*th,t,.12);snd.lp.frequency.setTargetAtTime(220+500*th,t,.15);
  snd.g.gain.setTargetAtTime(.05+.05*th+.02*load,t,.1);snd.bg.gain.setTargetAtTime(st.v<-.05&&now%900<420?.02:0,t,.01);}

/* ================= Simulation step ================= */
function step(dt){
  if(auto.on){const lanes=cur.lanes,lane=lanes[auto.pass%lanes.length],th=normAng(st.th),fwd=auto.phase==='fwd',e=st.z-lane;
    st.tgtV=(fwd?.8:-.95)*cur.vmax;
    if(cur.track)st.tgtS=clamp(fwd?(.15*e-.9*th):-.9*th,-.55,.55);else st.tgtS=clamp(fwd?(.35*e-1.6*th):1.2*th,-.5,.5);
    cur.auto(fwd,dt,lane,auto.pass);
    if(fwd&&st.x>27)auto.phase='rev';if(!fwd&&st.x<-27){auto.phase='fwd';auto.pass++;}
  } else {let jy=joy.y,jx=joy.x;
    if(keys.has('w')||keys.has('arrowup'))jy=-1;if(keys.has('s')||keys.has('arrowdown'))jy=1;if(keys.has('a')||keys.has('arrowleft'))jx=-1;if(keys.has('d')||keys.has('arrowright'))jx=1;
    st.tgtV=Math.abs(jy)<.12?0:-jy*cur.vmax;st.tgtS=-jx*.55;}
  st.v=approach(st.v,st.tgtV||0,st.tgtV===0?cur.vmax*.8:cur.vmax*.45,dt);st.steer=approach(st.steer,st.tgtS||0,.9,dt);
  cur.levers.forEach((l,i)=>{if(held.has('L'+i+'+'))R.c[l.id]+=(l.inv?-1:1)*l.rate*dt;if(held.has('L'+i+'-'))R.c[l.id]-=(l.inv?-1:1)*l.rate*dt;R.c[l.id]=clamp(R.c[l.id],l.min,l.max);});
  const px=st.x,pz=st.z;
  if(cur.track)st.th+=st.steer*1.1*dt;else st.th+=st.v*Math.tan(st.steer)/cur.wb*dt;
  st.x=clamp(st.x+st.v*Math.cos(st.th)*dt,-35,35);st.z=clamp(st.z-st.v*Math.sin(st.th)*dt,-35,35);
  const dist=Math.hypot(st.x-px,st.z-pz)*(Math.sign(st.v)||1);
  const c=Math.cos(st.th),s=Math.sin(st.th),smp=(lx,lz)=>hAt(st.x+lx*c+lz*s,st.z-lx*s+lz*c);
  const k=cur.contact,hRL=smp(k.r,-k.half),hRR=smp(k.r,k.half),hFL=smp(k.f,-k.half),hFR=smp(k.f,k.half);
  const hR=(hRL+hRR)/2,hF=(hFL+hFR)/2,pitch=Math.atan2(hF-hR,k.f-k.r),roll=Math.atan2((hRL+hFL)-(hRR+hFR),4*k.half)*.7;
  G.position.set(st.x,hR-k.r*Math.tan(pitch),st.z);G.rotation.set(roll,st.th,pitch);G.updateMatrixWorld(true);
  cur.update(dt,dist);G.updateMatrixWorld(true);
  if(Math.abs(st.v)>.05&&dt>0){cur.work(dt,dist);tracks();}
}

/* ================= Loop ================= */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?62:50;camera.updateProjectionMatrix();pmat.uniforms.uK.value=renderer.domElement.height/(2*Math.tan(camera.fov*DEG/2));}
addEventListener('resize',resize);
genSite('raw');flushTerrain();placeStakes();
switchMachine('grader',false);placeOrbitCam();camPos.copy(camera.position);resize();
let last=performance.now(),hudT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;FRAME++;
  const sub=Math.abs(st.v)>2?2:1;for(let i=0;i<sub;i++){step(dt/sub);}
  effects(dt);flushTerrain();updateCamera(dt);sound(now);if(now-hudT>120){hud();hudT=now;}
  renderer.render(scene,camera);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
